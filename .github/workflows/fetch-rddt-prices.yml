name: Fetch RDDT historical prices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch prices
        env:
          AV_KEY: ${{ secrets.AV_API_KEY }}
        run: |
          set -o pipefail
          python scripts/fetch_rddt_prices.py | tee rddt_prices.csv

      - name: Save CSV output
        uses: actions/upload-artifact@v4
        with:
          name: rddt-prices-2026-09-02-to-2026-11-23
          path: rddt_prices.csv
          if-no-files-found: error
